# Quick local deployment for OmniMAM Frontend, API Server, and Task Worker.
#
# Build local images first, for example:
#   make configs
#   make image VERSION=latest REGISTRY_PREFIX=omnimam
#   make frontend.image FRONTEND_VERSION=latest FRONTEND_REGISTRY_PREFIX=omnimam
#   docker compose -f deployments/docker-compose.yaml up -d
#
# The Makefile image rule tags host-arch images as <version>-<arch>.
# Override OMNIMAM_IMAGE_TAG when needed, for example latest-arm64.
# `make compose` supplies local development defaults for JWT, OPAQUE setup, and Infrastructure credentials;
# override OMNIMAM_AUTH_JWT_SECRET, OMNIMAM_OPAQUE_SERVER_SETUP, OMNIMAM_INFRA_SERVICE_TOKEN, and
# OMNIMAM_INFRA_PROFILE_IMAGES for non-local deployments.

services:
  conductor:
    image: conductoross/conductor:3.31.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CONFIG_PROP: config-postgres.properties
      CONDUCTOR_POSTGRES_USER: ${OMNIMAM_CONDUCTOR_POSTGRES_USER:-conductor}
      CONDUCTOR_POSTGRES_PASSWORD: ${OMNIMAM_CONDUCTOR_POSTGRES_PASSWORD:-conductor}
    volumes:
      - ./conductor/config-postgres.properties:/app/config/config-postgres.properties:ro
    ports:
      - "${OMNIMAM_CONDUCTOR_PORT:-8081}:8080"
    healthcheck:
      # TaskSchedule 依赖 Scheduler API；仅检查通用 health 会把不支持调度的旧镜像判为可用。
      test: [CMD-SHELL, "curl -fsS http://localhost:8080/health >/dev/null && curl -fsS http://localhost:8080/api/scheduler/schedules >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec]
    volumes:
      - omnimam_conductor_queue_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:16-alpine
    container_name: omnimam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${OMNIMAM_POSTGRES_DB:-omnimam}
      POSTGRES_USER: ${OMNIMAM_POSTGRES_USER:-omnimam}
      POSTGRES_PASSWORD: ${OMNIMAM_POSTGRES_PASSWORD:-omnimam}
      CONDUCTOR_POSTGRES_DB: conductor
      CONDUCTOR_POSTGRES_USER: ${OMNIMAM_CONDUCTOR_POSTGRES_USER:-conductor}
      CONDUCTOR_POSTGRES_PASSWORD: ${OMNIMAM_CONDUCTOR_POSTGRES_PASSWORD:-conductor}
    ports:
      - "${OMNIMAM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - omnimam_postgres_data:/var/lib/postgresql/data
      - ./postgres/init-conductor.sh:/docker-entrypoint-initdb.d/10-init-conductor.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  apiserver:
    image: ${OMNIMAM_REGISTRY_PREFIX:-omnimam}/apiserver:${OMNIMAM_IMAGE_TAG:-latest-amd64}
    container_name: omnimam-apiserver
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      conductor:
        condition: service_healthy
    environment:
      omnimam_LOG_DIR: /var/log/omnimam
      APISERVER_RUNTIME_DEBUG_OUTPUT_DIR: /var/lib/omnimam/debug/apiserver
      APISERVER_INSECURE_BIND_ADDRESS: 0.0.0.0
      APISERVER_INSECURE_BIND_PORT: 8080
      APISERVER_SECURE_BIND_ADDRESS: 0.0.0.0
      APISERVER_SECURE_BIND_PORT: 8443
      APISERVER_DATABASE_TYPE: postgresql
      APISERVER_DATABASE_NAME: ${OMNIMAM_POSTGRES_DB:-omnimam}
      APISERVER_POSTGRES_HOST: postgres
      APISERVER_POSTGRES_PORT: 5432
      APISERVER_POSTGRES_USER: ${OMNIMAM_POSTGRES_USER:-omnimam}
      APISERVER_POSTGRES_PASSWORD: ${OMNIMAM_POSTGRES_PASSWORD:-omnimam}
      APISERVER_MYSQL_HOST: mysql
      APISERVER_MYSQL_USER: omnimam
      APISERVER_MYSQL_PASSWORD: omnimam
      APISERVER_SECURE_TLS_CERT_FILE: /etc/omnimam/cert/apiserver.crt
      APISERVER_SECURE_TLS_CERT_KEY: /etc/omnimam/cert/apiserver.key
      APISERVER_ASSET_UPLOAD_CHUNK_TEMP_DIR: /var/lib/omnimam/upload-parts
      APISERVER_ASSET_UPLOAD_CHUNK_CLEANUP_HOURS: ${OMNIMAM_UPLOAD_CHUNK_CLEANUP_HOURS:-24}
      APISERVER_ENGINE_HEALTH_INTERVAL: ${OMNIMAM_ENGINE_HEALTH_INTERVAL:-30s}
      APISERVER_AUTH_JWT_SECRET: ${OMNIMAM_AUTH_JWT_SECRET:?OMNIMAM_AUTH_JWT_SECRET must be at least 32 bytes}
      APISERVER_OPAQUE_SERVER_SETUP: ${OMNIMAM_OPAQUE_SERVER_SETUP:-010020abc0c2392ed018c208ad37c5244d207242b90d3ba4ba4f27c1b0ac6e777bd800002074739b77bd3c26c247dad430b6d3a110cc20d1f25ea1a6f209d96bdfad51503f0040e1735bdb4d9b7cef37fe280642b65f448a0c498cc0d7d67b78d9209d03d669b65ae8be55d6b4d7b325b0f4ae7ee7769b1b8ff9fcb4ab3e6e0a1f468ac866a7f90000}
      APISERVER_MCP_PUBLIC_BASE_URL: ${OMNIMAM_MCP_PUBLIC_BASE_URL:-http://127.0.0.1:${OMNIMAM_APISERVER_PORT:-8080}}
      APISERVER_WORKFLOW_RUNTIME_ENABLED: "true"
      APISERVER_CONDUCTOR_BASE_URL: http://conductor:8080/api
      APISERVER_CONDUCTOR_AUTH_KEY: ${OMNIMAM_CONDUCTOR_AUTH_KEY:-}
      APISERVER_CONDUCTOR_AUTH_SECRET: ${OMNIMAM_CONDUCTOR_AUTH_SECRET:-}
      APISERVER_INFRASTRUCTURE_CLIENT_BASE_URL: http://infraserver:8082
      APISERVER_INFRASTRUCTURE_CLIENT_TOKEN: ${OMNIMAM_INFRA_SERVICE_TOKEN:?OMNIMAM_INFRA_SERVICE_TOKEN must be at least 32 bytes}
      OMNIMAM_STORAGE_ROOT: /var/lib/omnimam/assets
    ports:
      - "${OMNIMAM_APISERVER_PORT:-8080}:8080"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        render_config() {
          template="$$1"
          output="$$2"
          cp "$$template" "$$output"
          for name in \
            omnimam_LOG_DIR \
            APISERVER_RUNTIME_DEBUG_OUTPUT_DIR \
            APISERVER_INSECURE_BIND_ADDRESS \
            APISERVER_INSECURE_BIND_PORT \
            APISERVER_SECURE_BIND_ADDRESS \
            APISERVER_SECURE_BIND_PORT \
            APISERVER_SECURE_TLS_CERT_FILE \
            APISERVER_SECURE_TLS_CERT_KEY \
            APISERVER_ASSET_UPLOAD_CHUNK_TEMP_DIR \
            APISERVER_ASSET_UPLOAD_CHUNK_CLEANUP_HOURS \
            APISERVER_ENGINE_HEALTH_INTERVAL \
            APISERVER_AUTH_JWT_SECRET \
            APISERVER_OPAQUE_SERVER_SETUP \
            APISERVER_MCP_PUBLIC_BASE_URL \
            APISERVER_WORKFLOW_RUNTIME_ENABLED \
            APISERVER_CONDUCTOR_BASE_URL \
            APISERVER_CONDUCTOR_AUTH_KEY \
            APISERVER_CONDUCTOR_AUTH_SECRET \
            APISERVER_INFRASTRUCTURE_CLIENT_BASE_URL \
            APISERVER_INFRASTRUCTURE_CLIENT_TOKEN \
            APISERVER_DATABASE_TYPE \
            APISERVER_DATABASE_NAME \
            APISERVER_POSTGRES_HOST \
            APISERVER_POSTGRES_PORT \
            APISERVER_POSTGRES_USER \
            APISERVER_POSTGRES_PASSWORD \
            APISERVER_MYSQL_HOST \
            APISERVER_MYSQL_USER \
            APISERVER_MYSQL_PASSWORD; do
            value="$$(printenv "$$name" || true)"
            escaped="$$(printf '%s' "$$value" | sed 's/[\/&]/\\&/g')"
            sed -i "s/\$${$$name}/$$escaped/g" "$$output"
          done
        }
        render_config /etc/omnimam-template/apiserver.yaml /tmp/apiserver.yaml
        exec /opt/omnimam/bin/apiserver -c /tmp/apiserver.yaml
    volumes:
      - ../configs/apiserver.yaml:/etc/omnimam-template/apiserver.yaml:ro
      - omnimam_logs:/var/log/omnimam
      - omnimam_debug:/var/lib/omnimam/debug
      - omnimam_assets:/var/lib/omnimam/assets

  infraserver:
    image: ${OMNIMAM_REGISTRY_PREFIX:-omnimam}/infraserver:${OMNIMAM_IMAGE_TAG:-latest-amd64}
    container_name: omnimam-infraserver
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # API Server 先完成 schema 与 Identity/Platform 初始化，Infrastructure 再初始化同一数据库。
      apiserver:
        condition: service_started
    environment:
      omnimam_LOG_DIR: /var/log/omnimam
      APISERVER_RUNTIME_DEBUG_OUTPUT_DIR: /var/lib/omnimam/debug/infraserver
      APISERVER_INSECURE_BIND_ADDRESS: 127.0.0.1
      APISERVER_INSECURE_BIND_PORT: 8080
      APISERVER_SECURE_BIND_ADDRESS: 127.0.0.1
      APISERVER_SECURE_BIND_PORT: 8443
      APISERVER_SECURE_TLS_CERT_FILE: ""
      APISERVER_SECURE_TLS_CERT_KEY: ""
      APISERVER_DATABASE_TYPE: postgresql
      APISERVER_DATABASE_NAME: ${OMNIMAM_POSTGRES_DB:-omnimam}
      APISERVER_POSTGRES_HOST: postgres
      APISERVER_POSTGRES_PORT: 5432
      APISERVER_POSTGRES_USER: ${OMNIMAM_POSTGRES_USER:-omnimam}
      APISERVER_POSTGRES_PASSWORD: ${OMNIMAM_POSTGRES_PASSWORD:-omnimam}
      APISERVER_MYSQL_HOST: mysql
      APISERVER_MYSQL_USER: omnimam
      APISERVER_MYSQL_PASSWORD: omnimam
      APISERVER_ASSET_UPLOAD_CHUNK_TEMP_DIR: /var/lib/omnimam/upload-parts
      APISERVER_ASSET_UPLOAD_CHUNK_CLEANUP_HOURS: ${OMNIMAM_UPLOAD_CHUNK_CLEANUP_HOURS:-24}
      APISERVER_ENGINE_HEALTH_INTERVAL: ${OMNIMAM_ENGINE_HEALTH_INTERVAL:-30s}
      APISERVER_AUTH_JWT_SECRET: ${OMNIMAM_AUTH_JWT_SECRET:?OMNIMAM_AUTH_JWT_SECRET must be at least 32 bytes}
      APISERVER_OPAQUE_SERVER_SETUP: ${OMNIMAM_OPAQUE_SERVER_SETUP:-010020abc0c2392ed018c208ad37c5244d207242b90d3ba4ba4f27c1b0ac6e777bd800002074739b77bd3c26c247dad430b6d3a110cc20d1f25ea1a6f209d96bdfad51503f0040e1735bdb4d9b7cef37fe280642b65f448a0c498cc0d7d67b78d9209d03d669b65ae8be55d6b4d7b325b0f4ae7ee7769b1b8ff9fcb4ab3e6e0a1f468ac866a7f90000}
      APISERVER_MCP_PUBLIC_BASE_URL: http://127.0.0.1:8080
      APISERVER_WORKFLOW_RUNTIME_ENABLED: "false"
      APISERVER_CONDUCTOR_BASE_URL: ""
      APISERVER_CONDUCTOR_AUTH_KEY: ""
      APISERVER_CONDUCTOR_AUTH_SECRET: ""
      APISERVER_INFRASTRUCTURE_CLIENT_BASE_URL: http://infraserver:8082
      APISERVER_INFRASTRUCTURE_CLIENT_TOKEN: ${OMNIMAM_INFRA_SERVICE_TOKEN:?OMNIMAM_INFRA_SERVICE_TOKEN must be at least 32 bytes}
      OMNIMAM_DOCKER_SOCKET: /var/run/docker.sock
      OMNIMAM_DOCKER_API_VERSION: ${OMNIMAM_DOCKER_API_VERSION:-v1.44}
      OMNIMAM_INFRA_LISTEN_ADDRESS: 0.0.0.0:8082
      OMNIMAM_INFRA_SERVICE_TOKEN: ${OMNIMAM_INFRA_SERVICE_TOKEN:?OMNIMAM_INFRA_SERVICE_TOKEN must be at least 32 bytes}
      OMNIMAM_INFRA_PROFILE_IMAGES: ${OMNIMAM_INFRA_PROFILE_IMAGES:?OMNIMAM_INFRA_PROFILE_IMAGES must be a JSON object}
    ports:
      - "${OMNIMAM_INFRA_PORT:-8082}:8082"
    healthcheck:
      test: [CMD-SHELL, "/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8082'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../configs/apiserver.yaml:/etc/omnimam-template/apiserver.yaml:ro
      - omnimam_logs:/var/log/omnimam
      - omnimam_debug:/var/lib/omnimam/debug
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        wait_for_apiserver() {
          while ! /bin/bash -ec 'exec 3<>/dev/tcp/apiserver/8080; printf "GET /healthz HTTP/1.1\r\nHost: apiserver\r\nConnection: close\r\n\r\n" >&3; IFS= read -r -t 2 status <&3; case "$$status" in HTTP/1.1\ 200\ *|HTTP/1.0\ 200\ *) exit 0;; *) exit 1;; esac'; do
            sleep 1
          done
        }
        wait_for_apiserver
        cp /etc/omnimam-template/apiserver.yaml /tmp/infraserver.yaml
        for name in \
          omnimam_LOG_DIR \
          APISERVER_RUNTIME_DEBUG_OUTPUT_DIR \
          APISERVER_INSECURE_BIND_ADDRESS \
          APISERVER_INSECURE_BIND_PORT \
          APISERVER_SECURE_BIND_ADDRESS \
          APISERVER_SECURE_BIND_PORT \
          APISERVER_SECURE_TLS_CERT_FILE \
          APISERVER_SECURE_TLS_CERT_KEY \
          APISERVER_DATABASE_TYPE \
          APISERVER_DATABASE_NAME \
          APISERVER_POSTGRES_HOST \
          APISERVER_POSTGRES_PORT \
          APISERVER_POSTGRES_USER \
          APISERVER_POSTGRES_PASSWORD \
          APISERVER_MYSQL_HOST \
          APISERVER_MYSQL_USER \
          APISERVER_MYSQL_PASSWORD \
          APISERVER_ASSET_UPLOAD_CHUNK_TEMP_DIR \
          APISERVER_ASSET_UPLOAD_CHUNK_CLEANUP_HOURS \
          APISERVER_ENGINE_HEALTH_INTERVAL \
          APISERVER_AUTH_JWT_SECRET \
          APISERVER_OPAQUE_SERVER_SETUP \
          APISERVER_MCP_PUBLIC_BASE_URL \
          APISERVER_WORKFLOW_RUNTIME_ENABLED \
          APISERVER_CONDUCTOR_BASE_URL \
          APISERVER_CONDUCTOR_AUTH_KEY \
          APISERVER_CONDUCTOR_AUTH_SECRET \
          APISERVER_INFRASTRUCTURE_CLIENT_BASE_URL \
          APISERVER_INFRASTRUCTURE_CLIENT_TOKEN; do
          value="$$(printenv "$$name" || true)"
          escaped="$$(printf '%s' "$$value" | sed 's/[\/&]/\\&/g')"
          sed -i "s/\$${$$name}/$$escaped/g" /tmp/infraserver.yaml
        done
        exec /opt/omnimam/bin/infraserver -c /tmp/infraserver.yaml

  taskworker:
    image: ${OMNIMAM_REGISTRY_PREFIX:-omnimam}/taskworker:${OMNIMAM_IMAGE_TAG:-latest-amd64}
    container_name: omnimam-taskworker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      conductor:
        condition: service_healthy
      # API Server 先完成 schema 初始化；Worker 随后再连接同一业务数据库，避免并发 AutoMigrate。
      apiserver:
        condition: service_started
      infraserver:
        condition: service_healthy
    environment:
      omnimam_LOG_DIR: /var/log/omnimam
      APISERVER_RUNTIME_DEBUG_OUTPUT_DIR: /var/lib/omnimam/debug/taskworker
      # TaskWorker 复用 API Server Options；即使不监听 HTTP，也必须解析完整模板中的服务字段。
      APISERVER_INSECURE_BIND_ADDRESS: 127.0.0.1
      APISERVER_INSECURE_BIND_PORT: 8080
      APISERVER_SECURE_BIND_ADDRESS: 127.0.0.1
      APISERVER_SECURE_BIND_PORT: 8443
      APISERVER_SECURE_TLS_CERT_FILE: ""
      APISERVER_SECURE_TLS_CERT_KEY: ""
      APISERVER_DATABASE_TYPE: postgresql
      APISERVER_DATABASE_NAME: ${OMNIMAM_POSTGRES_DB:-omnimam}
      APISERVER_POSTGRES_HOST: postgres
      APISERVER_POSTGRES_PORT: 5432
      APISERVER_POSTGRES_USER: ${OMNIMAM_POSTGRES_USER:-omnimam}
      APISERVER_POSTGRES_PASSWORD: ${OMNIMAM_POSTGRES_PASSWORD:-omnimam}
      APISERVER_MYSQL_HOST: mysql
      APISERVER_MYSQL_USER: omnimam
      APISERVER_MYSQL_PASSWORD: omnimam
      APISERVER_ASSET_UPLOAD_CHUNK_TEMP_DIR: /var/lib/omnimam/upload-parts
      APISERVER_ASSET_UPLOAD_CHUNK_CLEANUP_HOURS: ${OMNIMAM_UPLOAD_CHUNK_CLEANUP_HOURS:-24}
      APISERVER_ENGINE_HEALTH_INTERVAL: ${OMNIMAM_ENGINE_HEALTH_INTERVAL:-30s}
      APISERVER_AUTH_JWT_SECRET: ${OMNIMAM_AUTH_JWT_SECRET:?OMNIMAM_AUTH_JWT_SECRET must be at least 32 bytes}
      APISERVER_OPAQUE_SERVER_SETUP: ${OMNIMAM_OPAQUE_SERVER_SETUP:-010020abc0c2392ed018c208ad37c5244d207242b90d3ba4ba4f27c1b0ac6e777bd800002074739b77bd3c26c247dad430b6d3a110cc20d1f25ea1a6f209d96bdfad51503f0040e1735bdb4d9b7cef37fe280642b65f448a0c498cc0d7d67b78d9209d03d669b65ae8be55d6b4d7b325b0f4ae7ee7769b1b8ff9fcb4ab3e6e0a1f468ac866a7f90000}
      APISERVER_MCP_PUBLIC_BASE_URL: ${OMNIMAM_MCP_PUBLIC_BASE_URL:-http://127.0.0.1:${OMNIMAM_APISERVER_PORT:-8080}}
      APISERVER_WORKFLOW_RUNTIME_ENABLED: "true"
      APISERVER_CONDUCTOR_BASE_URL: http://conductor:8080/api
      APISERVER_CONDUCTOR_AUTH_KEY: ${OMNIMAM_CONDUCTOR_AUTH_KEY:-}
      APISERVER_CONDUCTOR_AUTH_SECRET: ${OMNIMAM_CONDUCTOR_AUTH_SECRET:-}
      APISERVER_INFRASTRUCTURE_CLIENT_BASE_URL: http://infraserver:8082
      APISERVER_INFRASTRUCTURE_CLIENT_TOKEN: ${OMNIMAM_INFRA_SERVICE_TOKEN:?OMNIMAM_INFRA_SERVICE_TOKEN must be at least 32 bytes}
      # 缩略图 Worker 必须与 API Server 读取同一素材根目录。
      OMNIMAM_STORAGE_ROOT: /var/lib/omnimam/assets
    volumes:
      - ../configs/apiserver.yaml:/etc/omnimam-template/apiserver.yaml:ro
      - omnimam_assets:/var/lib/omnimam/assets
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        wait_for_apiserver() {
          while ! /bin/bash -ec 'exec 3<>/dev/tcp/apiserver/8080; printf "GET /healthz HTTP/1.1\r\nHost: apiserver\r\nConnection: close\r\n\r\n" >&3; IFS= read -r -t 2 status <&3; case "$$status" in HTTP/1.1\ 200\ *|HTTP/1.0\ 200\ *) exit 0;; *) exit 1;; esac'; do
            sleep 1
          done
        }
        wait_for_apiserver
        cp /etc/omnimam-template/apiserver.yaml /tmp/taskworker.yaml
        for name in \
          omnimam_LOG_DIR \
          APISERVER_RUNTIME_DEBUG_OUTPUT_DIR \
          APISERVER_INSECURE_BIND_ADDRESS \
          APISERVER_INSECURE_BIND_PORT \
          APISERVER_SECURE_BIND_ADDRESS \
          APISERVER_SECURE_BIND_PORT \
          APISERVER_SECURE_TLS_CERT_FILE \
          APISERVER_SECURE_TLS_CERT_KEY \
          APISERVER_DATABASE_TYPE \
          APISERVER_DATABASE_NAME \
          APISERVER_POSTGRES_HOST \
          APISERVER_POSTGRES_PORT \
          APISERVER_POSTGRES_USER \
          APISERVER_POSTGRES_PASSWORD \
          APISERVER_MYSQL_HOST \
          APISERVER_MYSQL_USER \
          APISERVER_MYSQL_PASSWORD \
          APISERVER_ASSET_UPLOAD_CHUNK_TEMP_DIR \
          APISERVER_ASSET_UPLOAD_CHUNK_CLEANUP_HOURS \
          APISERVER_ENGINE_HEALTH_INTERVAL \
          APISERVER_AUTH_JWT_SECRET \
          APISERVER_OPAQUE_SERVER_SETUP \
          APISERVER_MCP_PUBLIC_BASE_URL \
          APISERVER_WORKFLOW_RUNTIME_ENABLED \
          APISERVER_CONDUCTOR_BASE_URL \
          APISERVER_CONDUCTOR_AUTH_KEY \
          APISERVER_CONDUCTOR_AUTH_SECRET \
          APISERVER_INFRASTRUCTURE_CLIENT_BASE_URL \
          APISERVER_INFRASTRUCTURE_CLIENT_TOKEN; do
          value="$$(printenv "$$name" || true)"
          escaped="$$(printf '%s' "$$value" | sed 's/[\/&]/\\&/g')"
          sed -i "s/\$${$$name}/$$escaped/g" /tmp/taskworker.yaml
        done
        exec /opt/omnimam/bin/taskworker -c /tmp/taskworker.yaml

  notificationworker:
    image: ${OMNIMAM_REGISTRY_PREFIX:-omnimam}/notificationworker:${OMNIMAM_IMAGE_TAG:-latest-amd64}
    container_name: omnimam-notificationworker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # API Server 先完成 Notification Center schema 初始化；独立 Worker 不连接 Conductor。
      apiserver:
        condition: service_started
    environment:
      omnimam_LOG_DIR: /var/log/omnimam
      APISERVER_RUNTIME_DEBUG_OUTPUT_DIR: /var/lib/omnimam/debug/notificationworker
      # NotificationWorker 复用 API Server Options，但不监听 HTTP 或加载 Provider/Workflow runtime。
      APISERVER_INSECURE_BIND_ADDRESS: 127.0.0.1
      APISERVER_INSECURE_BIND_PORT: 8080
      APISERVER_SECURE_BIND_ADDRESS: 127.0.0.1
      APISERVER_SECURE_BIND_PORT: 8443
      APISERVER_SECURE_TLS_CERT_FILE: ""
      APISERVER_SECURE_TLS_CERT_KEY: ""
      APISERVER_DATABASE_TYPE: postgresql
      APISERVER_DATABASE_NAME: ${OMNIMAM_POSTGRES_DB:-omnimam}
      APISERVER_POSTGRES_HOST: postgres
      APISERVER_POSTGRES_PORT: 5432
      APISERVER_POSTGRES_USER: ${OMNIMAM_POSTGRES_USER:-omnimam}
      APISERVER_POSTGRES_PASSWORD: ${OMNIMAM_POSTGRES_PASSWORD:-omnimam}
      APISERVER_MYSQL_HOST: mysql
      APISERVER_MYSQL_USER: omnimam
      APISERVER_MYSQL_PASSWORD: omnimam
      APISERVER_ASSET_UPLOAD_CHUNK_TEMP_DIR: /var/lib/omnimam/upload-parts
      APISERVER_ASSET_UPLOAD_CHUNK_CLEANUP_HOURS: ${OMNIMAM_UPLOAD_CHUNK_CLEANUP_HOURS:-24}
      APISERVER_ENGINE_HEALTH_INTERVAL: ${OMNIMAM_ENGINE_HEALTH_INTERVAL:-30s}
      APISERVER_AUTH_JWT_SECRET: ${OMNIMAM_AUTH_JWT_SECRET:?OMNIMAM_AUTH_JWT_SECRET must be at least 32 bytes}
      APISERVER_OPAQUE_SERVER_SETUP: ${OMNIMAM_OPAQUE_SERVER_SETUP:-010020abc0c2392ed018c208ad37c5244d207242b90d3ba4ba4f27c1b0ac6e777bd800002074739b77bd3c26c247dad430b6d3a110cc20d1f25ea1a6f209d96bdfad51503f0040e1735bdb4d9b7cef37fe280642b65f448a0c498cc0d7d67b78d9209d03d669b65ae8be55d6b4d7b325b0f4ae7ee7769b1b8ff9fcb4ab3e6e0a1f468ac866a7f90000}
      APISERVER_MCP_PUBLIC_BASE_URL: ${OMNIMAM_MCP_PUBLIC_BASE_URL:-http://127.0.0.1:${OMNIMAM_APISERVER_PORT:-8080}}
      APISERVER_WORKFLOW_RUNTIME_ENABLED: "false"
      APISERVER_CONDUCTOR_BASE_URL: ""
      APISERVER_CONDUCTOR_AUTH_KEY: ""
      APISERVER_CONDUCTOR_AUTH_SECRET: ""
      APISERVER_INFRASTRUCTURE_CLIENT_BASE_URL: http://infraserver:8082
      APISERVER_INFRASTRUCTURE_CLIENT_TOKEN: ${OMNIMAM_INFRA_SERVICE_TOKEN:?OMNIMAM_INFRA_SERVICE_TOKEN must be at least 32 bytes}
    volumes:
      - ../configs/apiserver.yaml:/etc/omnimam-template/apiserver.yaml:ro
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        wait_for_apiserver() {
          while ! /bin/bash -ec 'exec 3<>/dev/tcp/apiserver/8080; printf "GET /healthz HTTP/1.1\r\nHost: apiserver\r\nConnection: close\r\n\r\n" >&3; IFS= read -r -t 2 status <&3; case "$$status" in HTTP/1.1\ 200\ *|HTTP/1.0\ 200\ *) exit 0;; *) exit 1;; esac'; do
            sleep 1
          done
        }
        wait_for_apiserver
        cp /etc/omnimam-template/apiserver.yaml /tmp/notificationworker.yaml
        for name in \
          omnimam_LOG_DIR \
          APISERVER_RUNTIME_DEBUG_OUTPUT_DIR \
          APISERVER_INSECURE_BIND_ADDRESS \
          APISERVER_INSECURE_BIND_PORT \
          APISERVER_SECURE_BIND_ADDRESS \
          APISERVER_SECURE_BIND_PORT \
          APISERVER_SECURE_TLS_CERT_FILE \
          APISERVER_SECURE_TLS_CERT_KEY \
          APISERVER_DATABASE_TYPE \
          APISERVER_DATABASE_NAME \
          APISERVER_POSTGRES_HOST \
          APISERVER_POSTGRES_PORT \
          APISERVER_POSTGRES_USER \
          APISERVER_POSTGRES_PASSWORD \
          APISERVER_MYSQL_HOST \
          APISERVER_MYSQL_USER \
          APISERVER_MYSQL_PASSWORD \
          APISERVER_ASSET_UPLOAD_CHUNK_TEMP_DIR \
          APISERVER_ASSET_UPLOAD_CHUNK_CLEANUP_HOURS \
          APISERVER_ENGINE_HEALTH_INTERVAL \
          APISERVER_AUTH_JWT_SECRET \
          APISERVER_OPAQUE_SERVER_SETUP \
          APISERVER_MCP_PUBLIC_BASE_URL \
          APISERVER_WORKFLOW_RUNTIME_ENABLED \
          APISERVER_CONDUCTOR_BASE_URL \
          APISERVER_CONDUCTOR_AUTH_KEY \
          APISERVER_CONDUCTOR_AUTH_SECRET \
          APISERVER_INFRASTRUCTURE_CLIENT_BASE_URL \
          APISERVER_INFRASTRUCTURE_CLIENT_TOKEN; do
          value="$$(printenv "$$name" || true)"
          escaped="$$(printf '%s' "$$value" | sed 's/[\/&]/\\&/g')"
          sed -i "s/\$${$$name}/$$escaped/g" /tmp/notificationworker.yaml
        done
        exec /opt/omnimam/bin/notificationworker -c /tmp/notificationworker.yaml

volumes:
  omnimam_postgres_data:
  omnimam_conductor_queue_data:
  omnimam_logs:
  omnimam_debug:
  omnimam_assets:
