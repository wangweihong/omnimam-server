conductor.db.type=postgres
# Conductor 3.31 PostgresQueueDAO 在更新同一延迟消息时保留 popped 状态，短周期 scheduler
# 会等待 unack 回收后才再次可见。队列使用持久化 Redis，业务和 Conductor 元数据仍保存在 PostgreSQL。
conductor.queue.type=redis_standalone
conductor.external-payload-storage.type=postgres

conductor.redis.hosts=redis:6379:us-east-1c
conductor.redis.workflowNamespacePrefix=conductor
conductor.redis.queueNamespacePrefix=conductor_queues
# RedisQueueDAO 使用 Jedis，不会创建 redis-lock 模块要求的 RedissonClient；开启该健康指示器会使
# Conductor 3.31 在混合 PostgreSQL metadata + Redis queue 配置下启动失败。Redis 由 Compose 单独探活。
management.health.redis.enabled=false

spring.datasource.url=jdbc:postgresql://postgres:5432/conductor
spring.datasource.username=${CONDUCTOR_POSTGRES_USER:conductor}
spring.datasource.password=${CONDUCTOR_POSTGRES_PASSWORD:conductor}

conductor.indexing.enabled=true
conductor.indexing.type=postgres
conductor.elasticsearch.version=0
conductor.grpc-server.enabled=false
